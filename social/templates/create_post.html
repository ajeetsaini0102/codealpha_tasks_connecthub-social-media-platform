{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - ConnectHub</title>
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/create_post.css' %}">
</head>

<body>

    {% include "navbar.html" %}

    <div class="create-post-container">

        <div class="create-post-card">

            <h1>Create New Post</h1>

            <p class="create-post-subtitle">Share what's on your mind with your followers.</p>

            <form method="POST">
                {% csrf_token %}

                <textarea class="post-textarea" name="content" placeholder="What's on your mind?" required></textarea>

                <button class="create-post-button" type="submit">Publish Post</button>
            </form>

        </div>

    </div>
    <script src="{% static 'js/create_post.js' %}"></script>
</body>

</html>
