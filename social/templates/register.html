{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ConnectHub</title>
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo">
                <h1>Connect<span>Hub</span></h1>
                <p>Create your account and start connecting</p>
            </div>

            <h2>Create Account</h2>

            <p class="subtitle">Join our social community</p>

            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST" id="registerForm">
                {% csrf_token %}

                <div class="name-row">

                    <div class="input-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" placeholder="First Name" required>
                    </div>

                    <div class="input-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" placeholder="Last Name" required>
                    </div>

                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                        <button type="button" id="togglePassword">Show</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm_password">Confirm Password</label>

                    <div class="password-box">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                        <button type="button" id="toggleConfirmPassword">Show</button>
                    </div>
                </div>

                <div id="passwordMessage" class="password-message"></div>

                <button type="submit" class="register-button">Create Account</button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>

        </div>

    </div>

    <script src="{% static 'js/register.js' %}"></script>

</body>
</html>
